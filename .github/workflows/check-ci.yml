name: Code Checks

on:
  workflow_call:

env:
  CI_NAME: Code Checks

jobs:
  lint-and-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify pinned prediction source bytes
        run: python3 -B script/ci/check_predict_source_pins.py

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 17
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        run: python3 -B script/ci/setup_android_cli.py

      - name: Check code style
        run: make style-lint

      - name: Run unit tests and lint
        run: make check
